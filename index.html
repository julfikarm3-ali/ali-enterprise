<script>
function openBkash(num){
  // 1. নাম্বার কপি
  navigator.clipboard.writeText(num);
  alert(num + " কপি হয়েছে! এখন বিকাশ অ্যাপে পেস্ট করুন");
  
  // 2. বিকাশ অ্যাপ ওপেন করার চেষ্টা
  window.location.href = "intent://#Intent;package=com.bKash.customerapp;end";
  
  // 3. যদি অ্যাপ না থাকে, 1.5 সেকেন্ড পরে প্লে-স্টোরে নিয়ে যাবে
  setTimeout(function(){
    window.location.href = "https://play.google.com/store/apps/details?id=com.bKash.customerapp";
  }, 1500);
}

function openNagad(num){
  navigator.clipboard.writeText(num);
  alert(num + " কপি হয়েছে! এখন নগদ অ্যাপে পেস্ট করুন");
  window.location.href = "intent://#Intent;package=com.konasl.nagad;end";
  setTimeout(function(){
    window.location.href = "https://play.google.com/store/apps/details?id=com.konasl.nagad";
  }, 1500);
}
</script>
